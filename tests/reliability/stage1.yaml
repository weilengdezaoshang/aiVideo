version: 1
timeout_seconds: 300
case_timeout_seconds: 120
timer_lock_seconds: 30
scenarios:
  - id: empty_migration_cycle
    covers:
      - block1_empty_migrate_rollback_reupgrade
    planner: &id002
      - plan:
          goal: 改图后生成视频
          steps:
            - id: t1
              tool: edit
              parameters: &id005
                prompt: edit
                image:
                  asset_id: $asset
                  media_type: image
            - &id006
              id: t2
              tool: video
              parameters:
                prompt: video
                image: $t1.output
              depends_on:
                - t1
        confidence: 1
        tokens: 2
    probe: migration_cycle
    provider: &id003
      actual_credits: 3
    expect: &id004
      run: completed
      canvas_artifacts: 2
      charged: 6
      submissions: 2
  - id: diagnostics_contract
    covers:
      - trace_pagination_auth_redaction
      - metrics_alerts
      - invariant_negative_controls
    planner:
      - plan: &id001
          goal: 改图后生成视频
          steps:
            - id: t1
              tool: edit
              parameters:
                prompt: edit
                image:
                  asset_id: $asset
                  media_type: image
            - id: t2
              tool: video
              parameters:
                prompt: video
                image: $t1.output
              depends_on:
                - t1
        confidence: 1
        tokens: 2
        raw_output:
          api_key: sensitive-marker
          plan: *id001
    probe: diagnostics_contract
    provider:
      actual_credits: 3
    expect:
      run: completed
      canvas_artifacts: 2
      charged: 6
      submissions: 2
  - id: core_contracts
    covers:
      - all_state_edges
      - optimistic_lock
      - state_outbox_transaction
    planner: *id002
    probe: contracts
    provider: *id003
    expect: *id004
  - id: tool_and_asset_contracts
