groups:
  - name: aivideo-durable-execution
    rules:
      - alert: AiVideoUnknownTasks
        expr: aivideo_jobs{status="unknown"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '存在结果待确认任务；禁止将 unknown 重置为 queued'
      - alert: AiVideoOutboxBacklog
        expr: aivideo_outbox_oldest_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '可靠投递积压，检查 Dispatcher、RabbitMQ 和发布确认'
      - alert: AiVideoExpiredLeases
        expr: aivideo_expired_leases > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: '过期执行租约未被 Scheduler 回收'
      - alert: AiVideoDeadEvents
        expr: aivideo_outbox{status="failed"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox 有死信；必须核对任务阶段后审计恢复'
      - alert: AiVideoHostReservationStuck
        expr: aivideo_host_reservation_oldest_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Host 积分预占长时间未结算；核对上游收据，禁止直接退款后重提'
      - alert: AiVideoHostLeaseRecovery
        expr: aivideo_host_expired_node_leases > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: 'Host 节点租约过期；检查 Agent Worker 和 Scheduler'
      - alert: AiVideoHostNeedsAttention
        expr: aivideo_host_runs{status="needs_attention"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Host 上游结果未知；等待对账或显式取消，禁止重复付费提交'
