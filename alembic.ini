[alembic]
script_location = apps/api/backend/migrations
# 实际 URL 由 env AIVERO/AIVIDEO 注入或测试显式覆盖;此处仅占位。
sqlalchemy.url = postgresql+psycopg://aivideo:aivideo@127.0.0.1:5432/aivideo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
