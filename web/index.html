<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SwarmUI MVP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>"/>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<header class="topbar">
  <div class="brand">🐝 <b>SwarmUI</b><span class="mvp">MVP</span></div>
  <div class="topbar-right">
    <span id="backend-pill" class="pill"><span class="dot"></span><span id="backend-text">连接中…</span></span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <section class="panel">
      <h2>提示词</h2>
      <textarea id="prompt" rows="5" placeholder="描述你想生成的画面,例如:一只宇航员猫,霓虹灯,电影感(Cmd+Enter 快速生成)"></textarea>
      <textarea id="negative-prompt" rows="2" placeholder="反向提示词(可选):lowres, blurry, watermark"></textarea>
    </section>

    <section class="panel">
      <h2>模型</h2>
      <select id="model"></select>
      <div id="model-hint" class="hint"></div>
    </section>

    <section class="panel">
      <h2>参数</h2>
      <select id="size-preset">
        <option value="">尺寸预设…</option>
        <option value="512x512">512 × 512 方形</option>
        <option value="768x768">768 × 768 大方形</option>
        <option value="1024x1024">1024 × 1024 XL 方形</option>
        <option value="512x768">512 × 768 竖版</option>
        <option value="768x512">768 × 512 横版</option>
        <option value="1024x576">1024 × 576 宽屏</option>
      </select>
      <div class="grid2">
        <label>宽度<input id="width" type="number" min="64" max="2048" step="8" value="512"/></label>
        <label>高度<input id="height" type="number" min="64" max="2048" step="8" value="512"/></label>
      </div>
      <label class="slider">步数 <b id="steps-val">20</b><input id="steps" type="range" min="1" max="60" value="20"/></label>
      <label class="slider">CFG <b id="cfg-val">7</b><input id="cfg" type="range" min="1" max="20" step="0.5" value="7"/></label>
      <label class="slider">重绘幅度 <b id="denoise-val">1</b><input id="denoise" type="range" min="0.05" max="1" step="0.05" value="1" title="1 = 文生图;上传参考图后调低即为图生图"/></label>
      <div class="grid2">
        <label>采样器<select id="sampler"></select></label>
        <label>调度器<select id="scheduler"></select></label>
      </div>
      <div class="grid2">
        <label>种子<input id="seed" type="number" step="1" value="-1" title="-1 表示随机"/></label>
        <label>批量<input id="batch" type="number" min="1" max="16" value="1"/></label>
      </div>
      <button id="generate" class="primary">✨ 生成</button>
      <div id="form-error" class="error"></div>
    </section>

    <section class="panel">
      <h2>图生图(可选)</h2>
      <div id="drop-zone" class="drop-zone" title="点击选择或拖入参考图">
        <div id="drop-hint">点击选择或拖入参考图<br/><span class="hint">上传后把「重绘幅度」调到 1 以下即为图生图</span></div>
        <img id="init-preview" class="hidden" alt="参考图预览"/>
        <input id="init-file" type="file" accept="image/png,image/jpeg,image/webp" hidden/>
      </div>
      <button id="init-clear" class="hidden">移除参考图</button>
    </section>

    <section class="panel">
      <h2>参数预设</h2>
      <select id="preset-select">
        <option value="">选择预设…</option>
      </select>
      <div class="row">
        <input id="preset-name" type="text" placeholder="预设名称"/>
        <button id="preset-save">保存</button>
      </div>
      <button id="preset-delete" class="danger">删除选中预设</button>
    </section>
  </aside>

  <main class="results">
    <div class="results-head">
      <h1>生成结果</h1>
      <span id="history-count" class="hint"></span>
    </div>
    <div id="jobs"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty">还没有生成记录 — 在左侧输入提示词,点击「生成」试试</div>
  </main>
</div>

<div id="lightbox" class="lightbox hidden">
  <button class="lb-close" id="lb-close" title="关闭 (Esc)">×</button>
  <button class="lb-nav lb-prev" id="lb-prev" title="上一张 (←)">‹</button>
  <button class="lb-nav lb-next" id="lb-next" title="下一张 (→)">›</button>
  <div class="lb-body">
    <img id="lb-img" alt=""/>
    <div class="lb-meta">
      <div id="lb-caption" class="lb-prompt"></div>
      <div id="lb-params" class="lb-params"></div>
      <div class="lb-actions">
        <button id="lb-reuse">复用全部参数</button>
        <button id="lb-reuse-seed">仅复用种子</button>
        <a id="lb-download" class="btn" download>下载</a>
        <button id="lb-delete" class="danger">删除</button>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
