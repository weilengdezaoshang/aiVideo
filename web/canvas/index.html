<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenCanvas · 生成式创作画布</title>
  <link rel="stylesheet" href="/vendor/shoelace/cdn/themes/light.css">
  <link rel="stylesheet" href="canvas.css">
  <script src="/vendor/konva/konva.min.js"></script>
  <script type="module" src="/vendor/shoelace/cdn/shoelace-autoloader.js"></script></head>
<body>
  <!-- 顶栏:画布切换 / 模型选择 / 进行中任务数 / 保存状态(线框 S3) -->
  <header class="topbar">
    <sl-dropdown>
      <sl-button slot="trigger" caret size="small" variant="default">画布</sl-button>
      <sl-menu id="canvas-menu">
        <sl-menu-item>未命名画布</sl-menu-item>
        <sl-divider></sl-divider>
        <sl-menu-item id="canvas-new">
          <sl-icon slot="prefix" name="plus-lg"></sl-icon>
          新建画布
        </sl-menu-item>
      </sl-menu>
    </sl-dropdown>

    <sl-select id="model-select" size="small" placeholder="模型" style="width: 12rem;">
      <sl-option value="flux">FLUX</sl-option>
    </sl-select>

    <span class="topbar-spacer"></span>

    <sl-icon-button id="settings-open" name="gear" label="设置(BYOK / 后端)"></sl-icon-button>
    <span class="topbar-status" id="job-count" title="进行中的任务数">
      <sl-icon name="hourglass-split"></sl-icon>
      <span id="job-count-value">0</span>
    </span>
    <span class="topbar-status" id="save-status">已保存</span>
  </header>

  <!-- 画布区:灰底网点 + 空态引导;Konva 舞台挂载在专用空容器(Stage 构造会清空宿主) -->
  <main class="canvas-root" id="canvas-root">
    <div class="canvas-surface" id="canvas-surface"></div>
    <div class="canvas-empty" id="canvas-empty">
      <p class="canvas-empty-title">画布是空的</p>
      <p class="canvas-empty-hint">按 <kbd>Tab</kbd> 呼出提示词面板,开始第一张图</p>
    </div>

    <!-- 提示词面板:收起态为一个按钮,Tab 展开(T8 接生成闭环) -->
    <section class="prompt-panel" id="prompt-panel" hidden>
      <sl-textarea id="prompt-input" placeholder="输入提示词…(例:一只戴墨镜的猫在沙滩上)"
        rows="3" autofocus></sl-textarea>
      <div class="prompt-panel-row">
        <sl-select id="prompt-model" size="small" placeholder="模型" style="width: 9rem;">
          <sl-option value="flux">FLUX</sl-option>
        </sl-select>
        <sl-select id="prompt-size" size="small" placeholder="尺寸" style="width: 8rem;">
          <sl-option value="1024">1024</sl-option>
        </sl-select>
        <sl-input id="prompt-seed" size="small" placeholder="种子:随机" style="width: 8rem;"></sl-input>
      </div>
      <button class="dropzone" id="ref-dropzone" type="button">
        <sl-icon name="image"></sl-icon>
        拖入参考图(可选,留空 = 文生图)
      </button>
      <div class="prompt-panel-row prompt-panel-actions">
        <sl-button size="small" id="prompt-collapse">收起</sl-button>
        <sl-button size="small" variant="primary" id="prompt-generate">
          <sl-icon slot="prefix" name="stars"></sl-icon>
          生成
        </sl-button>
      </div>
    </section>

    <!-- 缩放控件(右下角);引擎接线在 T4 -->
    <nav class="zoom-controls" aria-label="缩放控制">
      <sl-button-group>
        <sl-button size="small" id="zoom-out"><sl-icon name="zoom-out"></sl-icon></sl-button>
        <span class="zoom-value" id="zoom-value">100%</span>
        <sl-button size="small" id="zoom-in"><sl-icon name="zoom-in"></sl-icon></sl-button>
      </sl-button-group>
    </nav>
  </main>

  <!-- BYOK 设置对话框(线框 S2/S2a/S2b):后端热切换 + 测试连接 + API Key 管理 -->
  <sl-dialog id="settings-dialog" label="设置" style="--width: 30rem;">
    <div class="settings-section">
      <div class="settings-title">生成后端</div>
      <div class="settings-row">
        <sl-select id="settings-provider" size="small" style="width: 100%;">
          <sl-option value="mock">演示模式(Mock,无需配置)</sl-option>
          <sl-option value="comfyui">本地 ComfyUI</sl-option>
        </sl-select>
      </div>
      <div class="settings-row" id="settings-comfy-row">
        <sl-input id="settings-comfy-url" size="small" placeholder="http://127.0.0.1:8188"
          style="flex: 1;"></sl-input>
        <sl-button size="small" id="settings-test">测试连接</sl-button>
      </div>
      <div class="settings-test-result" id="settings-test-result" hidden></div>
    </div>

    <div class="settings-section">
      <div class="settings-title">云端模型 API Key(BYOK)</div>
      <div class="settings-row">
        <sl-input id="settings-image-key" size="small" type="password" password-toggle
          placeholder="图像 API Key…" style="flex: 1;"></sl-input>
        <sl-icon-button id="settings-image-key-clear" name="x-lg" label="清除图像 Key"
          title="清除已保存的图像 Key"></sl-icon-button>
      </div>
      <div class="settings-row">
        <sl-input id="settings-video-key" size="small" type="password" password-toggle
          placeholder="视频 API Key…" style="flex: 1;"></sl-input>
        <sl-icon-button id="settings-video-key-clear" name="x-lg" label="清除视频 Key"
          title="清除已保存的视频 Key"></sl-icon-button>
      </div>
      <div class="settings-hint">
        Key 仅保存在本机 config.json,不随文档上传;留空 = 保持已保存值不变。
      </div>
    </div>

    <sl-button slot="footer" id="settings-cancel">取消</sl-button>
    <sl-button slot="footer" variant="primary" id="settings-save">保存</sl-button>
  </sl-dialog>

  <!-- 首次启动引导(线框 S1):三选一进入设置或直接体验 -->
  <sl-dialog id="onboarding-dialog" no-header style="--width: 26rem;">
    <div class="onb-head">欢迎使用 GenCanvas</div>
    <div class="onb-sub">选择一个生成后端开始(可随时在右下角设置中更改)</div>
    <button class="onb-card" id="onb-comfy" type="button">
      <b>① 连接本地 ComfyUI</b>
      <span>输入地址,如 http://127.0.0.1:8188</span>
    </button>
    <button class="onb-card" id="onb-byok" type="button">
      <b>② 填写模型 API Key</b>
      <span>使用云端模型(BYOK)</span>
    </button>
    <button class="onb-card" id="onb-demo" type="button">
      <b>③ 先用演示模式逛逛</b>
      <span>内置 Mock 后端,不需要任何配置</span>
    </button>
  </sl-dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
