name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 与 .husky/commit-msg 共用同一校验器(scripts/commit-lint.mjs)
      - name: 校验提交信息
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "基准提交不可用(如新分支首次推送),跳过提交信息校验"
            exit 0
          fi
          node scripts/commit-lint.mjs --range "$BASE..HEAD"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run verify

  planner-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Planner 离线门禁（无准确率门槛，不调用付费模型）
        env:
          PYTHONPATH: apps/api
        run: |
          set -eu
          OUT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/aivideo-planner-offline-gate.XXXXXX")"
          echo "PLANNER_GATE_DIR=$OUT" >> "$GITHUB_ENV"
          echo "planner gate evidence directory: $OUT"
          .venv/bin/python -m backend.evaluation.planner_gate --output "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-offline-gate
          path: ${{ env.PLANNER_GATE_DIR }}/gate-evidence.json
          if-no-files-found: error

  plan-selfcheck-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: 计划自检离线门禁（不评模型质量，不调用网络）
        env:
          PYTHONPATH: apps/api
        run: |
          set -eu
          OUT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/aivideo-selfcheck-offline.XXXXXX")"
          .venv/bin/python -m backend.evaluation.selfcheck_cli --mode offline --output "$OUT"
          .venv/bin/python -m backend.evaluation.selfcheck_cli --mode rules --output "$OUT/rules"
          .venv/bin/python -c "import json,sys; p=json.load(open('$OUT/summary.json')); assert p['llm_tested'] is False and p['model'] is None and p['legal_type_pass']==80"

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: reliability-test
          POSTGRES_DB: reliability_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 2s --health-retries 30
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: reliability-test
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 3s
          --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - name: 阶段一 YAML 可靠性回归（硬预算五分钟）
        timeout-minutes: 5
        env:
          PYTHONPATH: apps/api
          AIVERO_RELIABILITY_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_RELIABILITY_BROKER: amqp://test:reliability-test@127.0.0.1:5672//
          AIVERO_RELIABILITY_REDIS: redis://127.0.0.1:6379/0
        run: .venv/bin/python -m backend.evaluation.reliability.cli --external --output /tmp/reliability-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-reliability
          path: /tmp/reliability-report
          if-no-files-found: error
      - name: Planner 数据库与进程恢复回归（仅假接口）
        env:
          PYTHONPATH: apps/api
          AIVERO_DB_URL: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_SUPERVISOR_TEST_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_EXECUTION_TEST_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_DURABLE_TEST_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python -m pytest -q --junitxml=/tmp/planner-integration.xml \
            tests/integration/test_planner_model_calls.py \
            tests/integration/test_supervisor_llm_wiring.py \
            tests/integration/test_supervisor_constraints.py \
            tests/integration/test_supervisor_failure_protocol.py \
            tests/integration/test_read_execution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-integration
          path: /tmp/planner-integration.xml
          if-no-files-found: warn
      - name: 画布多轮会话与多端恢复回归（仅假接口）
        env:
          PYTHONPATH: apps/api
          AIVERO_DB_URL: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_CORE_TEST_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_SUPERVISOR_TEST_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_EXECUTION_TEST_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_DURABLE_TEST_DB: postgresql+psycopg://postgres:reliability-test@127.0.0.1:5432/reliability_test
          AIVERO_DURABLE_TEST_REDIS: redis://127.0.0.1:6379/0
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python -m pytest -q --junitxml=/tmp/session-integration.xml \
            tests/integration/test_session*.py tests/integration/test_block9_pg.py \
            tests/integration/test_supervisor_pipeline.py
          .venv/bin/python -m backend.evaluation.reference_cli --output /tmp/session-reference-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-integration
          path: |
            /tmp/session-integration.xml
            /tmp/session-reference-report
          if-no-files-found: warn
