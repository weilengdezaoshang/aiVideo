<text x="776" y="628" class="edge" text-anchor="middle">MQ 派发</text>
<rect x="40" y="65" width="315" height="75" rx="9" fill="#edf3ff" stroke="#4778ba" stroke-width="1.2"/>
<text x="56" y="93" class="title">apps/web · TypeScript</text>
<text x="56" y="116" class="body">landing / workspace / canvas / eval</text>
<rect x="430" y="65" width="330" height="75" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="446" y="93" class="title">tsc + esbuild</text>
<text x="446" y="116" class="body">npm run build:web</text>
<rect x="840" y="65" width="320" height="75" rx="9" fill="#f3effa" stroke="#8871b2" stroke-width="1.2"/>
<text x="856" y="93" class="title">.web-build/</text>
<text x="856" y="116" class="body">按历史 .js URL 提供构建文件</text>
<rect x="45" y="265" width="300" height="110" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="61" y="293" class="title">npm run dev -- --env-file …</text>
<text x="61" y="316" class="body">scripts/backend.py</text>
<text x="61" y="336" class="body">tsc / esbuild 监听</text>
<text x="61" y="356" class="body">Uvicorn --reload</text>
<rect x="45" y="460" width="300" height="120" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="61" y="488" class="title">宿主 API 热重载</text>
<text x="61" y="511" class="body">backend.app:create_app</text>
<text x="61" y="531" class="body">与容器 API 共用数据库架构</text>
<text x="61" y="551" class="body">不创建内存 FIFO / JSON 存储</text>
<text x="61" y="571" class="body">仍需 OIDC 与工作区授权</text>
<rect x="45" y="675" width="300" height="110" rx="9" fill="#f3effa" stroke="#8871b2" stroke-width="1.2"/>
<text x="61" y="703" class="title">显式依赖与配置</text>
<text x="61" y="726" class="body">可访问的数据库 / Redis</text>
<text x="61" y="746" class="body">固定路由 / OIDC / 共享媒体</text>
<text x="61" y="766" class="body">需独立运行 daemon 和 Worker</text>
<rect x="435" y="265" width="315" height="110" rx="9" fill="#f3f4f5" stroke="#8c949f" stroke-width="1.2"/>
<text x="451" y="293" class="title">Caddy 网关</text>
<text x="451" y="316" class="body">HTTP 80 / HTTPS 443</text>
<text x="451" y="336" class="body">反代 api:7801 / SSE flush</text>
<text x="451" y="356" class="body">外部 OIDC 提供身份</text>
<rect x="830" y="265" width="315" height="110" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="846" y="293" class="title">API 容器</text>
<text x="846" y="316" class="body">python -m backend</text>
<text x="846" y="336" class="body">FastAPI / 静态资源 / OIDC</text>
<text x="846" y="356" class="body">仅挂载固定路由配置</text>
<rect x="435" y="460" width="315" height="120" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="451" y="488" class="title">四个 daemon 容器</text>
<text x="451" y="511" class="body">dispatcher / scheduler</text>
<text x="451" y="531" class="body">bridge / notify</text>
<text x="451" y="551" class="body">独立进程，不启动 Celery beat</text>
<rect x="830" y="460" width="315" height="120" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="846" y="488" class="title">三个 Celery Worker 容器</text>
<text x="846" y="511" class="body">image 并发 2 / video 并发 1</text>
<text x="846" y="531" class="body">exports 并发 1</text>
<text x="846" y="551" class="body">生成 Worker 挂载 Provider secret</text>
<rect x="435" y="675" width="315" height="110" rx="9" fill="#f3effa" stroke="#8871b2" stroke-width="1.2"/>
<text x="451" y="703" class="title">数据库与消息基础设施</text>
<text x="451" y="726" class="body">PostgreSQL 16 / RabbitMQ 3.13</text>
<text x="451" y="746" class="body">Redis 7：AOF / noeviction</text>
<text x="451" y="766" class="body">migrate：Alembic upgrade head</text>
<rect x="830" y="675" width="315" height="110" rx="9" fill="#f3effa" stroke="#8871b2" stroke-width="1.2"/>
<text x="846" y="703" class="title">共享 media 卷 /app/data</text>
<text x="846" y="726" class="body">API / Workers / scheduler 共用</text>
<text x="846" y="746" class="body">媒体文件 / receipt / 模型权重</text>
<text x="846" y="766" class="body">数据库等另有各自持久卷</text>
<rect x="435" y="850" width="710" height="65" rx="9" fill="#f3f4f5" stroke="#8c949f" stroke-width="1.2"/>
<text x="451" y="878" class="title">Docker 运行镜像</text>
<text x="451" y="901" class="body">Python 3.11 + FFmpeg + 非 root UID 10001；无 Node 业务运行时</text>
</svg>