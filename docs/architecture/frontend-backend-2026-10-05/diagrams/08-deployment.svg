<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">构建与部署：同一后端的热重载与容器启动方式</title><desc id="desc">Node 构建前端、Python 运行 API。默认 Compose 与 compose.dev.yaml 解析为同一套 13 服务；宿主热重载也使用同一数据库应用工厂。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#778494"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:17px;font-weight:650;fill:#192b3b}.body{font-size:13px;fill:#526376}.edge{font-size:12px;fill:#57687a;paint-order:stroke;stroke:#fcfcfa;stroke-width:7px;stroke-linejoin:round}.group{font-size:13px;font-weight:650;fill:#687787}</style>
<rect width="1200" height="1010" fill="#fcfcfa" rx="14"/>
<rect x="20" y="20" width="1160" height="155" rx="12" fill="#f5f6f6" stroke="#dce2e5" stroke-dasharray="6 5"/>
<text x="38" y="44" class="group">构建阶段 · npm workspaces / Node</text>
<rect x="20" y="215" width="350" height="730" rx="12" fill="#f5f6f6" stroke="#dce2e5" stroke-dasharray="6 5"/>
<text x="38" y="239" class="group">源码开发 · 相同的数据库 API</text>
<rect x="405" y="215" width="775" height="730" rx="12" fill="#f5f6f6" stroke="#dce2e5" stroke-dasharray="6 5"/>
<text x="423" y="239" class="group">统一 Compose 单机拓扑</text>
<path d="M355,102.5 L392.5,102.5 L392.5,102.5 L430,102.5" fill="none" stroke="#778494" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M760,102.5 L800.0,102.5 L800.0,102.5 L840,102.5" fill="none" stroke="#778494" stroke-width="1.7" marker-end="url(#arrow)"/>
