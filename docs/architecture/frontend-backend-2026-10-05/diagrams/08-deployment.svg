<path d="M987.5,580 L987.5,627.5 L987.5,627.5 L987.5,675" fill="none" stroke="#778494" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M830,340 L788,340 L788,625 L565,625 L565,675" fill="none" stroke="#778494" stroke-width="1.7" marker-end="url(#arrow)"/>
