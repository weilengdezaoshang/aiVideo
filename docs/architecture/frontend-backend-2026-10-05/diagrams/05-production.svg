<text x="56" y="93" class="title">production.create_app</text>
<text x="56" y="116" class="body">REST / 同源静态资源 / SSE</text>
<text x="56" y="136" class="body">OIDC + session + CSRF</text>
<rect x="420" y="65" width="330" height="95" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="436" y="93" class="title">受理与文档服务</text>
<text x="436" y="116" class="body">accept_generation / Documents</text>
<text x="436" y="136" class="body">幂等 / 容量 / revision / 引用</text>
<rect x="840" y="65" width="320" height="95" rx="9" fill="#f3effa" stroke="#8871b2" stroke-width="1.2"/>
