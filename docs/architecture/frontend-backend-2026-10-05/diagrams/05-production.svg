<text x="856" y="116" class="body">Job / Attempt / Outbox / Asset</text>
<text x="856" y="136" class="body">事务提交后才返回 202</text>
<rect x="40" y="210" width="300" height="80" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
