<text x="56" y="261" class="body">先订阅后 snapshot；周期回查 PG</text>
<text x="56" y="281" class="body">按工作区与 stateVersion 输出</text>
<rect x="420" y="210" width="330" height="80" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="436" y="238" class="title">scheduler</text>
<text x="436" y="261" class="body">扫描 next_poll_at / 过期 lease</text>
<text x="436" y="281" class="body">固定期限裁决 / receipt 恢复</text>
<rect x="840" y="210" width="320" height="80" rx="9" fill="#f3effa" stroke="#8871b2" stroke-width="1.2"/>
<text x="856" y="238" class="title">Redis</text>
<text x="856" y="261" class="body">工作区 pubsub / 操作取消</text>
<text x="856" y="281" class="body">操作级限流 / 熔断 / 凭据暂停</text>
<rect x="40" y="400" width="300" height="95" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="56" y="428" class="title">dispatcher</text>
<text x="56" y="451" class="body">领取 Outbox / SKIP LOCKED</text>
<text x="56" y="471" class="body">publisher confirm / claim_token</text>
<rect x="420" y="400" width="330" height="95" rx="9" fill="#f3effa" stroke="#8871b2" stroke-width="1.2"/>
<text x="436" y="428" class="title">RabbitMQ 事件拓扑</text>
<text x="436" y="451" class="body">execution.due → phase.events</text>
<text x="436" y="471" class="body">job.changed → notifications</text>
<rect x="840" y="400" width="320" height="95" rx="9" fill="#fff5e7" stroke="#b47a2b" stroke-width="1.2"/>
<text x="856" y="428" class="title">notify</text>
<text x="856" y="451" class="body">读取 PG 最新 Job 版本</text>
<text x="856" y="471" class="body">发布工作区 Redis 唤醒</text>
