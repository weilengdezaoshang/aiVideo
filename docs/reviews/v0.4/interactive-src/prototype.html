<style>

argin-bottom:12px;color:#555}.doc-grid{display:flex;flex-wrap:wrap}.canvas-region{position:relative;flex:1;min-width:0;background-color:#f7f7f7;background-image:radial-gradient(#d2d2d2 1px,transparent 1px);background-size:20px 20px}.viewport{position:absolute;inset:0 0 142px;overflow:auto}.world{position:relative;width:2200px;height:1400px;transform-origin:0 0}.fixed-tools{position:absolute;z-index:5;top:95px;left:12px;display:flex;flex-direction:column;gap:3px;padding:4px;border:1px solid #aaa;border-radius:9px;background:#fff}.fixed-tools button{width:40px;height:40px;padding:7px;border:0;position:relative}.fixed-tools button span{position:absolute;left:48px;top:6px;white-space:nowrap;padding:4px 8px;background:#222;color:#fff;border-radius:4px;display:none}.fixed-tools button:hover span,.fixed-tools button:focus-visible span{display:block}.fixed-tools svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.composer{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 120px);max-width:660px;background:#fff;border:1px solid #999;border-radius:10px;padding:12px;z-index:6}.composer textarea{display:block;width:100%;height:47px;resize:none;border:0;padding:4px 0;outline-offset:0}.composer .row{justify-content:space-between;font-size:12px}.composer select{font-size:12px;padding:4px;max-width:125px}.ref-chip{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding-bottom:7px;margin-bottom:4px;font-size:12px}.ref-chip button{min-height:24px;padding:1px 6px}.conversation{width:296px;flex-shrink:0;background:#fff;border-left:1px solid #bbb;display:flex;flex-direction:column}.conversation header{padding:16px;border-bottom:1px solid #ddd;font-weight:600}.conversation-body{padding:16px;overflow:auto;flex:1}.message{margin:0 0 18px}.message .who{font-size:12px;color:#595959;margin-bottom:4px}.bubble{padding:10px 12px;background:#f0f0f0;border-radius:7px;overflow-wrap:anywhere}.result-preview{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:10px 0}.mini{min-height:74px;border:1px solid #c3c3c3;background:#eee;display:grid;place-items:center;text-align:center;padding:6px;font-size:12px}.mini.loading{background:#333;color:white}.mini.error{background:#fafafa;border:1px dashed #666}.group{position:absolute;border:1px solid #aaa;border-radius:4px;padding:14px;background:#ffffff90;width:max-content}.group-head{cursor:grab;max-width:656px;margin-bottom:12px;display:flex;align-items:center;gap:12px;justify-content:space-between}.group-title{font-weight:600;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group-meta{font-size:12px;color:#4b4b4b}.image-row{display:flex;gap:24px;margin-top:30px}.tile{position:relative;border:1px solid #b7b7b7;background:#e8e8e8;border-radius:0;width:148px;height:148px;padding:0;display:grid;place-items:center;text-align:center;flex-shrink:0;overflow:visible}.tile .cross{position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - .5px),#c1c1c1 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),#c1c1c1 50%,transparent calc(50% + .5px))}.tile .caption{z-index:1;background:#eeeeeee8;padding:5px;font-size:12px}.tile .index{color:#333;position:absolute;top:5px;left:6px;background:#fff;padding:0 4px;font-size:11px}.tile.loading{background:#333;color:#fff;border-color:#333}.tile.error{background:#fff;border:1px dashed #666}.tile.selected{outline:2px solid #333;outline-offset:0}.handles i{position:absolute;width:9px;height:9px;border:1px solid #333;border-radius:50%;background:#fff;z-index:3}.handles i:nth-child(1){top:-5px;left:-5px}.handles i:nth-child(2){top:-5px;right:-5px}.handles i:nth-child(3){bottom:-5px;left:-5px}.handles i:nth-child(4){bottom:-5px;right:-5px}.handles i:nth-child(5){width:18px;height:7px;top:-4px;left:calc(50% - 9px);border-radius:4px}.handles i:nth-child(6){width:18px;height:7px;bottom:-4px;left:calc(50% - 9px);border-radius:4px}.handles i:nth-child(7){height:18px;width:7px;left:-4px;top:calc(50% - 9px);border-radius:4px}.handles i:nth-child(8){height:18px;width:7px;right:-4px;top:calc(50% - 9px);border-radius:4px}.image-tag{position:absolute;top:-29px;left:0;font-size:12px;background:#fff;padding:2px 4px;border:1px solid #ccc;white-space:nowrap}.group:has(.selected){padding-top:14px}.transparent{background-color:#fff;background-image:conic-gradient(#ddd 25%,transparent 0 50%,#ddd 0 75%,transparent 0);background-size:18px 18px}.transparent .caption{background:#fff;border:1px solid #999;padding:16px 6px;max-width:100px}.image-actions{display:flex;gap:6px;align-items:center;padding:8px;border:1px solid #aaa;border-radius:8px;background:#fff;position:absolute;z-index:8;max-width:calc(100% - 80px);overflow:auto;white-space:nowrap}.tools-scroll{display:flex;gap:6px;overflow:auto;min-width:0;flex:1}.tools-fixed{display:flex;gap:6px;flex-shrink:0}.toolbar-source{font-size:11px;max-width:105px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}.image-actions button{white-space:nowrap;flex-shrink:0;font-size:12px}.mask-info{max-width:650px;background:#f3f3f3;border:1px solid #aaa;padding:7px 10px;margin-bottom:9px;font-size:12px}.mask-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair}.mask-state{position:absolute;inset:0;background:#222c;z-index:4;color:#fff;display:grid;place-items:center;font-size:12px;padding:10px}.loose{position:absolute;min-width:148px}.board{width:280px;height:220px;border:1px solid #777;background:#fff;text-align:left;padding:8px;z-index:0}.text-object{font-size:32px;border:1px dashed #aaa;min-width:180px;background:#ffffffb0;padding:4px}.zoom{position:absolute;right:12px;top:12px;z-index:5;background:#fff;border:1px solid #aaa;padding:3px;border-radius:6px;display:flex;align-items:center;gap:5px}.zoom button{border:0;padding:4px 8px;font-size:12px}.toast{padding:9px 14px;background:#eee;border-top:1px solid #bbb;min-height:39px;font-size:12px}.sheet{position:absolute;z-index:12;inset:56px 0 0;background:#0003;display:grid;place-items:center;padding:24px}.sheet-body{max-height:95%;overflow:auto;background:#fff;border:1px solid #888;padding:24px;border-radius:10px;width:min(620px,100%)}.sheet-body input{width:100%}.asset-list{display:flex;gap:12px;margin:16px 0}.asset-choice{width:160px;min-height:120px}.sheet-body .row{margin-top:15px}.mode-note{margin-top:8px;font-size:12px}.status-line{padding:8px;background:#f3f3f3;border:1px solid #bbb;margin-bottom:12px;font-size:12px}.task-step{margin:8px 0}.demo-count{white-space:nowrap;font-variant-numeric:tabular-nums} [hidden]{display:none!important}
</style></head><body>
<!-- THESIS: 用可控状态演练验证四图组与显式蒙版提交。OWN-WORLD: 继承 v0.3 黑白灰线框、系统字体与紧凑控件。STORY: 从列表创建文档，到生成、抠图、引用与恢复。FIRST VIEWPORT: 评审控制台在产品画面之外，产品保留四工具、底部输入和右对话。FORM: 既有线框的流程演练扩展，未进行随机概念选择。FINISH: 以浏览器功能与布局复核结束，文档局部视觉约定随交付保存，不改全站 DESIGN.md。 -->
<div class="review-controls"><strong>评审控制台 · 非产品功能</strong><label>模拟响应 <select id="outcome"><option value="success">成功</option><option value="partial">四图部分完成</option><option value="failure">执行失败</option><option value="unknown">结果待确认</option></select></label><button id="respond">送达模拟响应</button><button id="save-fail">模拟保存失败</button><button id="reopen">模拟刷新恢复</button><button id="reset-demo">重置演练</button><span id="counter" class="demo-count"></span><div class="review-note">全部为本机示例，无模型调用。提交生图、发送助手需求或点击蒙版栏“抠图”后，用此处送达模拟响应。可操作选择、引用、蒙版涂画和草稿恢复；图片仅为线框占位。</div></div>
<div id="app" class="shell"></div><div id="toast" class="toast" role="status" aria-live="polite">从“画布”进入列表，再创建一张画布。当前没有产品服务连接。</div>
<script>
(()=>{'use strict';
const KEY='aivideo-prd-v04-demo-1', app=document.getElementById('app'), toast=document.getElementById('toast');
let model={page:'home',docs:[],current:null,seq:0}, selected=null, reference=null, mode='image', dialog=null, brush='paint', pan=null, draft='一只像人一样跳舞的橘猫', zoom=1;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.docs))model=saved;}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=p=>p+'-'+(++model.seq), doc=()=>model.docs.find(d=>d.id===model.current), notice=t=>{toast.textContent=t;}, persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(model));}catch{notice('本机演练存储不可用，刷新后可能丢失当前演练内容。');}};
const findObj=(d,oid)=>{for(const g of d.groups){const o=g.items.find(i=>i.id===oid);if(o)return {o,g};}const o=d.objects.find(i=>i.id===oid);return o?{o,g:null}:null;};
const icons={upload:'<path d="M12 16V3m-5 5 5-5 5 5M3 16v5h18v-5"/>',assets:'<rect x="5" y="3" width="16" height="16" rx="2"/><path d="M2 7v15h15M6 15l5-5 4 4 3-3 3 3"/>',board:'<path d="M3 7h18M3 17h18M7 3v18M17 3v18"/>',text:'<path d="M4 7V4h16v3M12 4v17M8 21h8"/>'};
const status=g=>({running:'正在生成 · 本轮 4 张 · 同时生成',success:'4/4 已生成',partial:'部分完成 · 2/4 已生成',failure:'失败 · 0/4 已生成',unknown:'结果待确认 · 查询同一任务',cancelled:'已停止后续处理'}[g.status]||g.status);
function storeDraft(){const d=doc();if(d){d.inputDraft=draft;d.inputMode=mode;d.reference=reference;persist();}}
function render(){const d=doc();document.getElementById('counter').textContent=d?`${d.groups.length} 组 · ${d.groups.reduce((a,g)=>a+g.items.filter(i=>i.status==='success').length,0)+d.objects.length} 个结果/对象`:model.docs.length+' 张示例画布';
app.innerHTML=model.page==='editor'&&d?editor(d):hub();bind();if(dialog)app.querySelector('.sheet button')?.focus();if(d&&model.page==='editor'){renderTools(d);drawMask(d);}
document.getElementById('respond').disabled=!d||!(d.groups.some(g=>['running','unknown'].includes(g.status))||d.mask&&['detecting','generating','unknown-detect','unknown-apply'].includes(d.mask.status));persist();}
function hub(){return `<div class="appbar"><b>AI 视觉创作</b><span class="grow"></span><small>流程演练 · 示例能力</small></div><div class="shell-body"><nav class="rail" aria-label="工作台模块"><button data-act="home" class="${model.page==='home'?'active':''}">工作台</button><button data-act="list" class="${model.page==='list'?'active':''}">画布</button><button data-act="legacy">图片</button><button data-act="video-entry">视频</button></nav><main class="hub">${model.page==='home'?`<div class="empty"><h2>从一个想法，开始创作</h2><p>在画布里生成、加工和整理素材。<br>创作过程和结果会保存在同一份文档。</p><button class="primary" data-act="list">进入我的画布</button></div>`:`<div class="row"><h2>我的画布</h2><span class="grow"></span><button class="primary" data-act="new">新建画布</button></div><p class="muted">打开已有画布继续创作；进入列表不会创建文档。</p>${model.docs.length?`<div class="doc-grid">${model.docs.map(d=>`<button class="doc-card" data-open="${d.id}"><span class="doc-cover">${d.groups.length} 个创意组 · ${d.objects.length} 个其他对象</span><b>${esc(d.name)}</b><p class="muted">${d.save==='error'?'有本机草稿待保存':'示例文档已保存'} · ${d.id}</p></button>`).join('')}</div>`:`<div class="empty"><h3>还没有画布</h3><p>创建一张画布，描述一个创意，得到四个候选方向。</p><button data-act="new">创建第一张画布</button></div>`}`}</main></div>${sheet()}`;}
function editor(d){return `<div class="appbar"><button data-act="back">返回我的画布</button><input id="docname" aria-label="画布名称" maxlength="100" value="${esc(d.name)}"><small>${d.save==='error'?'保存失败 · 本机草稿保留':'已保存（演练）'}</small>${d.save==='error'?'<button data-act="retry-save">重试保存</button>':''}<span class="grow"></span><small>${d.groups.filter(g=>g.status==='running').length+(d.mask&&['detecting','generating'].includes(d.mask.status)?1:0)} 个进行中任务${d.groups.some(g=>g.status==='unknown')||d.mask?.status.startsWith('unknown')?' · 有结果待确认':''}</small><button data-act="download">下载选中素材</button></div><div class="shell-body"><section class="canvas-region" aria-label="创作画布"><div class="viewport" id="viewport"><div class="world" id="world" style="transform:scale(${zoom})">${d.groups.map(group).join('')}${d.objects.map(loose).join('')}${!d.groups.length&&!d.objects.length?'<div class="empty" style="position:absolute;left:160px;top:85px;text-align:left"><h2>让想法落在画布上</h2><p>从左侧添加素材，<br>或在底部描述想生成的画面。</p></div>':''}</div></div><nav class="fixed-tools" aria-label="画布悬浮工具栏">${[['upload','本地上传'],['assets','导入资产'],['board','添加画板'],['text','添加文字']].map(([a,l])=>`<button data-act="${a}" aria-label="${l}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[a]}</svg><span>${l}</span></button>`).join('')}</nav><div class="zoom"><button data-act="zoom-out">缩小</button><span>${Math.round(zoom*100)}%</span><button data-act="zoom-in">放大</button><button data-act="locate">定位结果</button></div><form class="composer" id="composer">${reference&&mode==='agent'?`<div class="ref-chip">引用：${esc(findObj(d,reference)?.o.name||'引用已失效')}<button type="button" data-act="remove-ref">移除引用</button></div>`:''}<label for="prompt" class="muted">${mode==='image'?'4 个方向 × 每方向 1 张':'创作助手 · 当前画布的一张图片'}</label><textarea id="prompt" aria-label="创作需求" placeholder="描述你的想法…">${esc(draft)}</textarea><div class="row"><select id="input-mode" aria-label="输入模式"><option value="image" ${mode==='image'?'selected':''}>生成图片</option><option value="agent" ${mode==='agent'?'selected':''}>创作助手</option></select><span>对话与结果在右侧</span><button class="primary" id="send" type="submit" ${!draft.trim()||busy(d)?'disabled':''}>${mode==='image'?'生成 4 张':'发送需求'}</button></div></form><div id="floating"></div></section><aside class="conversation"><header>对话 <small style="float:right">当前画布</small></header><div class="conversation-body">${conversation(d)}</div></aside></div>${sheet()}`;}
function busy(d){return d.groups.some(g=>['running','unknown'].includes(g.status))||d.mask&&['detecting','generating','unknown-detect','unknown-apply'].includes(d.mask.status)||d.agent&&['plan','waiting'].includes(d.agent.status);}
function group(g){return `<section class="group" data-group="${g.id}" style="left:${g.x}px;top:${g.y}px"><div class="group-head" data-drag="${g.id}"><div><div class="group-title">${esc(g.prompt)}</div><div class="group-meta">${status(g)}${g.items.length>4?' · '+(g.items.length-4)+' 张抠图派生素材':''}</div></div><small>${g.id}</small></div>${doc().mask&&g.items.some(i=>i.id===doc().mask.source)?maskInfo(doc().mask):''}<div class="image-row">${g.items.map(tile).join('')}</div></section>`;}
function tile(o){const m=doc()?.mask,isMask=m&&m.source===o.id,sel=selected===o.id,success=o.status==='success';return `<div class="tile ${o.status==='running'?'loading':o.status==='failure'?'error':o.status} ${o.kind==='cutout'?'transparent':''} ${sel?'selected':''}" ${success?'role="button" tabindex="0"':''} aria-label="${esc(o.name)}${success?'，选择图片':'，'+(o.status==='running'?'生成中':o.status==='unknown'?'结果待确认':'生成失败')}" ${success?`aria-pressed="${sel}" data-select="${o.id}"`:''}>${success?`${o.kind==='cutout'?'':'<span class="cross"></span>'}<span class="caption">${esc(o.name)}<br><small>${o.kind==='cutout'?'透明 PNG · 示例':'方向占位 · 非真实生成'}</small></span>`:`<span>${o.status==='running'?'生成中…':o.status==='unknown'?'等待查询':'生成失败'}<br><small style="color:inherit">方向 ${o.slot+1}</small></span>`}${o.slot!==undefined?`<span class="index">${o.slot+1}</span>`:''}${sel?`<span class="image-tag">${o.kind==='cutout'?'抠图结果':'图片'}</span><span class="handles" aria-hidden="true">${'<i></i>'.repeat(8)}</span>`:''}${isMask?`<canvas id="mask-canvas" class="mask-canvas" width="296" height="296" aria-label="蒙版绘制区域"></canvas>${m.status==='ready'?'':`<div class="mask-state">${{detecting:'识别主体中…',generating:'生成透明图片中…','detect-error':'蒙版识别失败','apply-error':'结果生成失败 · 蒙版保留','unknown-detect':'识别结果待确认','unknown-apply':'生成结果待确认'}[m.status]}</div>`}`:''}</div>`;}
function maskInfo(m){return `<div class="mask-info">${m.status==='ready'?'正在编辑蒙版 · 高亮区域将保留；尚未生成透明图片。示例选区仅验证操作规则。':m.status==='generating'?'已锁定本次蒙版 · 正在生成透明图片，原图保留。':'抠图分为“准备选区”和“生成结果”两个阶段。'}</div>`;}
function loose(o){return `<div class="loose" style="left:${o.x}px;top:${o.y}px">${o.kind==='board'?`<div class="board">${esc(o.name)}<small> · 1024 × 1024<br>不裁剪、不合成导出</small></div>`:o.kind==='text'?`<div class="text-object" contenteditable="true" role="textbox" aria-label="画布文字" data-text="${o.id}">${esc(o.name)}</div>`:o.kind==='video'?`<button class="tile" data-video="${o.id}"><span>${esc(o.name)}<br>播放预览<br><small>文生视频来源 · 示例</small></span></button>`:`${doc().mask?.source===o.id?maskInfo(doc().mask):''}${tile(o)}`}</div>`;}
function conversation(d){let out=d.messages.map(m=>`<div class="message"><div class="who">${m.role==='user'?'你':'创作助手'}</div><div class="bubble">${esc(m.text)}</div></div>`).join('');
for(const g of d.groups){out+=`<div class="message"><div class="who">本轮图片 · ${g.id}</div><b>${esc(g.prompt)}</b><div class="group-meta">${status(g)}</div><div class="result-preview">${g.items.filter(o=>o.slot!==undefined).map(o=>`<div class="mini ${o.status==='running'?'loading':o.status==='failure'?'error':''}">${o.status==='success'?esc(o.name):o.status==='running'?'生成中…':o.status==='unknown'?'等待查询':'失败 · '+(o.slot+1)}</div>`).join('')}</div><button data-locate="${g.id}">定位这组结果</button>${['partial','failure'].includes(g.status)?`<p class="mode-note">${g.status==='partial'?'已返回图片保留。':'本轮未返回有效图片。'}另生成将调用四张图片，可能产生新费用；内容可能不同，旧组保留。</p><button data-retry="${g.id}" ${busy(d)?'disabled':''}>另生成一组 4 张</button>`:''}${g.status==='unknown'?'<p class="mode-note">只查询同一任务，不重复提交。</p>':''}</div>`;}
if(d.agent)out+=`<div class="message"><b>助手计划 · 仅处理引用图片</b><p class="task-step">1. 识别主体范围</p><p class="task-step">2. 由你检查并提交蒙版</p><p class="task-step">3. 生成透明 PNG，放到原图右侧</p>${d.agent.status==='plan'?'<button data-act="prepare" class="primary">准备蒙版</button>':['waiting','paused'].includes(d.agent.status)?'<div class="status-line">等待你检查蒙版。请点击画布中蒙版栏的“抠图”。</div><button data-act="inspect-mask">检查主体选区</button>':d.agent.status==='done'?'<div class="status-line">已在原图右侧新增透明素材。原图保留。</div>':'<div class="status-line">处理中，请关注画布中的当前步骤。</div>'}</div>`;
const cuts=d.groups.flatMap(g=>g.items).concat(d.objects).filter(o=>o.kind==='cutout');if(cuts.length)out+=cuts.map(o=>`<div class="message"><div class="mini transparent">${esc(o.name)}</div><p class="mode-note">来自 ${esc(findObj(d,o.source)?.o.name||'源图片')} · 新增派生素材</p><button data-select-result="${o.id}">定位抠图结果</button></div>`).join('');
return out||'<h3>对话从这里展开</h3><p>在画布底部描述想法。这里会显示你的消息、任务状态和生成结果。</p><p class="muted">所有预览都是评审示例。</p>';}
function renderTools(d){const target=selected&&findObj(d,selected);if(!target||target.o.status!=='success')return;const el=app.querySelector(`[data-select="${selected}"]`),area=app.querySelector('.canvas-region');if(!el||!area)return;const r=el.getBoundingClientRect(),a=area.getBoundingClientRect(),m=d.mask;let html='';
if(m&&m.source===selected){const ready=m.status==='ready';html=`${ready?`<button data-act="paint" aria-pressed="${brush==='paint'}">画笔</button><button data-act="erase" aria-pressed="${brush==='erase'}">橡皮</button><button data-act="mask-undo" ${m.strokes.length?'':'disabled'}>撤销</button><button data-act="mask-redo" ${m.redo.length?'':'disabled'}>重做</button>`:''}<button data-act="exit-mask" ${['generating','unknown-apply'].includes(m.status)?'disabled':''}>${ready?'退出蒙版':'返回图片'}</button>${m.status==='detect-error'?'<button data-act="redetect">重新识别</button>':m.status==='apply-error'?'<button data-act="return-mask">返回蒙版</button>':`<button class="primary" data-act="apply" ${ready?'':'disabled'}>${m.status==='generating'?'生成中…':'抠图'}</button>`}`;
}else html='<button data-act="reference">添加到对话</button><button data-act="cutout">抠图</button><button data-act="download">下载</button>';
const bar=document.createElement('div');bar.className='image-actions';bar.setAttribute('role','toolbar');bar.setAttribute('aria-label',m?'蒙版操作栏':'图片操作栏');const split=html.indexOf('<button data-act="exit-mask"');bar.innerHTML=m&&split>=0?'<div class="tools-scroll">'+html.slice(0,split)+'</div><div class="tools-fixed">'+html.slice(split)+'</div>':html;app.querySelector('#floating').replaceChildren(bar);const composer=app.querySelector('.composer').getBoundingClientRect(),safeBottom=composer.top-a.top-12;let top=Math.min(r.bottom-a.top+14,safeBottom-bar.offsetHeight);if(top<r.bottom-a.top+10){const label=document.createElement('span');label.className='toolbar-source';label.textContent=(m?'蒙版 · ':'图片 · ')+target.o.name;bar.prepend(label);top=safeBottom-bar.offsetHeight;}const left=Math.min(Math.max(70,r.left-a.left),a.width-bar.offsetWidth-14);bar.style.left=Math.max(12,left)+'px';bar.style.top=Math.max(54,top)+'px';}
function sheet(){if(!dialog)return '';let content='';if(dialog==='assets')content='<h3>导入已有资产</h3><p>复用同一资产，在当前文档创建新对象。下面是演练素材。</p><div class="asset-list"><button class="asset-choice" data-act="import-image">示例人物图片<br><small>图片资产 · 可抠图</small></button><button class="asset-choice" data-act="import-video">示例文生视频<br><small>原始来源：文字描述</small></button></div>';if(dialog==='upload')content='<h3>本地上传 · 流程示意</h3><p>正式产品会打开文件选择器。本次用示例素材验证加入和取消，不读取本机图片。</p><button data-act="import-image" class="primary">使用示例图片继续</button>';if(dialog==='leave')content='<h3>最新修改尚未保存</h3><p>本机草稿仍在。返回前可以重试；留在画布可以继续处理；返回不会取消后台任务。</p><div class="row"><button data-act="close">留在画布</button><button data-act="save-leave" class="primary">重试保存并返回</button></div>';if(dialog==='mask-exit')content='<h3>蒙版草稿尚未确认保存</h3><p>服务保存失败。演练可保留本机副本退出；正式产品仍应说明本机副本是否写入成功。</p><div class="row"><button data-act="keep-mask">保留草稿退出</button><button data-act="discard-mask">放弃本次蒙版</button></div>';if(dialog==='video')content='<h3>视频预览 · 播放状态示意</h3><div class="mini" style="height:220px">视频海报占位 · 没有加载真实视频文件</div><p class="mode-note">来源：文生视频 · 文字描述“傍晚街头的咖啡店”。所属当前画布。</p><p>正式实现使用独立原生播放器：播放进度操作不移动画布，关闭后停止播放。</p>';if(dialog==='legacy')content='<h3>已有生成入口</h3><p>首版建议复用现有图片 / 文生视频能力。四方向未通过真实能力验收前，新图片入口不冒充可用；图生视频、分镜与剪辑后置。</p>';return `<div class="sheet" role="dialog" aria-modal="true" aria-label="流程说明"><div class="sheet-body">${content}<div class="row"><button data-act="close">关闭</button></div></div></div>`;}
function bind(){app.onclick=actionClick;app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDoc(b.dataset.open));app.querySelectorAll('[data-select]').forEach(b=>{b.onclick=e=>{if(e.target.closest('canvas'))return;selected=b.dataset.select;render();};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=b.dataset.select;render();}};});app.querySelectorAll('[data-select-result]').forEach(b=>b.onclick=()=>{selected=b.dataset.selectResult;render();locateSelected();});app.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>{dialog='video';render();});app.querySelectorAll('[data-locate]').forEach(b=>b.onclick=()=>locateGroup(b.dataset.locate));app.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const g=doc().groups.find(g=>g.id===b.dataset.retry);generate(g.prompt,g.id);});
const name=app.querySelector('#docname');if(name){name.oninput=()=>{doc().name=name.value.trim()||'未命名画布';persist();};name.onchange=()=>{doc().name=name.value.trim()||'未命名画布';persist();};}const p=app.querySelector('#prompt');if(p)p.oninput=()=>{draft=p.value;storeDraft();app.querySelector('#send').disabled=!draft.trim()||!!busy(doc());};const im=app.querySelector('#input-mode');if(im)im.onchange=()=>{mode=im.value;storeDraft();render();};const form=app.querySelector('#composer');if(form)form.onsubmit=e=>{e.preventDefault();if(!draft.trim()||busy(doc()))return;if(mode==='image')generate(draft);else agentPlan();};app.querySelectorAll('[data-text]').forEach(el=>el.onblur=()=>{const o=doc().objects.find(o=>o.id===el.dataset.text);o.name=el.textContent.trim();if(!o.name)doc().objects=doc().objects.filter(x=>x.id!==o.id);persist();});
app.querySelectorAll('[data-drag]').forEach(el=>{el.onpointerdown=e=>{if(e.button!==0)return;const g=doc().groups.find(g=>g.id===el.dataset.drag);pan={x:e.clientX,y:e.clientY,g,ox:g.x,oy:g.y};el.setPointerCapture(e.pointerId);};el.onpointermove=e=>{if(!pan)return;pan.g.x=Math.max(68,pan.ox+(e.clientX-pan.x)/zoom);pan.g.y=Math.max(48,pan.oy+(e.clientY-pan.y)/zoom);el.closest('.group').style.left=pan.g.x+'px';el.closest('.group').style.top=pan.g.y+'px';renderTools(doc());};el.onpointerup=()=>{pan=null;persist();};});const vp=app.querySelector('#viewport');if(vp)vp.onscroll=()=>renderTools(doc());}
function actionClick(e){const b=e.target.closest('[data-act]');if(!b)return;if(b.disabled)return;const a=b.dataset.act,d=doc();switch(a){case'home':model.page='home';break;case'list':model.page='list';break;case'new':{const d={id:id('doc'),name:'未命名画布',groups:[],objects:[],messages:[],mask:null,agent:null,save:'saved'};model.docs.push(d);model.current=d.id;model.page='editor';selected=null;reference=null;break;}case'back':if(d.save==='error')dialog='leave';else{storeDraft();model.page='list';selected=null;}break;case'retry-save':d.save='saved';notice('演练：收到保存确认，文档状态恢复。');break;case'save-leave':d.save='saved';dialog=null;model.page='list';break;case'close':dialog=null;break;case'assets':dialog='assets';break;case'upload':dialog='upload';break;case'legacy':case'video-entry':dialog='legacy';break;case'import-image':addObj('image','人物原图');dialog=null;break;case'import-video':addObj('video','视频素材');dialog=null;break;case'board':addObj('board','画板 1');break;case'text':addObj('text','双击并编辑文字');break;case'reference':reference=selected;mode='agent';draft='把这张图的主体抠出来，放到原图旁边。';storeDraft();notice('引用已固定；选择其他图片不会改变本次引用。');break;case'remove-ref':reference=null;storeDraft();break;case'cutout':prepareMask(selected);break;case'inspect-mask':if(d.mask){selected=d.mask.source;notice('回到已有主体选区，没有重新识别。');}else if(d.maskDraft){selected=d.maskDraft.source;d.mask=d.maskDraft;d.maskDraft=null;if(d.agent)d.agent.status='waiting';notice('恢复已保存的蒙版草稿，没有重新识别。');}render();locateSelected();return;case'prepare':prepareMask(d.agent.source);d.agent.status='working';break;case'paint':brush='paint';break;case'erase':brush='erase';break;case'mask-undo':if(d.mask.strokes.length)d.mask.redo.push(d.mask.strokes.pop());break;case'mask-redo':if(d.mask.redo.length)d.mask.strokes.push(d.mask.redo.pop());break;case'exit-mask':if(d.save==='error')dialog='mask-exit';else{d.maskDraft=d.mask;d.mask=null;if(d.agent)d.agent.status='paused';notice('蒙版草稿已保留；退出不生成图片，重新进入可继续。');}break;case'keep-mask':d.maskDraft=d.mask;d.mask=null;dialog=null;if(d.agent)d.agent.status='paused';break;case'discard-mask':d.mask=null;d.maskDraft=null;dialog=null;if(d.agent)d.agent.status='paused';break;case'redetect':d.mask.status='detecting';break;case'return-mask':d.mask.status='ready';break;case'apply':if(d.mask?.status==='ready'){d.mask.status='generating';notice('仅此点击开始生成透明结果；原图和蒙版仍保留。请用评审控制台送达响应。');}break;case'download':notice(selected?'此为线框素材，没有真实文件可下载；产品方案为下载原始文件，透明结果固定 PNG。':'请先选择一张已生成的图片；文字和画板不可作为原文件下载。');break;case'zoom-out':zoom=Math.max(.5,zoom-.1);break;case'zoom-in':zoom=Math.min(1.5,zoom+.1);break;case'locate':render();locateSelected();return;}render();}
function openDoc(oid){model.current=oid;model.page='editor';const d=doc();selected=d.mask?.source||null;draft=d.inputDraft||'一只像人一样跳舞的橘猫';mode=d.inputMode||'image';reference=d.reference||null;render();notice('打开同一份示例画布；只恢复状态，不重新提交任务。');}
function addObj(kind,name){const d=doc(),o={id:id('obj'),kind,name,status:'success',x:98+(d.objects.length%3)*200,y:70+Math.floor(d.objects.length/3)*265};d.objects.push(o);selected=kind==='image'?o.id:null;notice('已新增'+name+'（演练），不触发模型调用。');}
function generate(prompt,retryOf){const d=doc();if(busy(d))return;const gid=id('group'),g={id:gid,prompt,status:'running',retryOf,x:90,y:65+d.groups.length*320,items:['正面构图','逆光侧影','街头场景','近景动态'].map((name,slot)=>({id:id('image'),slot,name,kind:'image',status:'running'}))};d.groups.push(g);d.messages.push({role:'user',text:prompt});draft='';selected=null;storeDraft();render();locateGroup(gid);notice('同一任务已同时出现四个占位。用评审控制台模拟整组响应；没有调用真实模型。');}
function agentPlan(){const d=doc(),ref=reference&&findObj(d,reference);if(!ref||!['image','cutout'].includes(ref.o.kind)){notice('请先选择一张图片并“添加到对话”，再说明想做什么。');return;}if(!/抠|提取主体|去掉背景|移除背景/.test(draft)||/再生成|视频|海报|合成|生成.*背景|多张/.test(draft)){d.messages.push({role:'agent',text:'首版演练仅支持把引用图片的主体抠出并放到旁边；其他请求先澄清，不执行。'});render();return;}d.messages.push({role:'user',text:draft+'（引用：'+ref.o.name+'）'});d.agent={source:reference,status:'working'};selected=reference;draft='';prepareMask(reference);storeDraft();render();notice('已按演练计划自动准备一次蒙版；正式实现须经过真实 LLM 与服务端校验。请送达模拟响应。');}
function prepareMask(source){const d=doc();if(!source)return;selected=source;if(d.maskDraft?.source===source){d.mask=d.maskDraft;d.mask.status='ready';d.maskDraft=null;notice('已恢复蒙版草稿，尚未生成透明结果。');}else{d.mask={source,status:'detecting',strokes:[],redo:[]};notice('正在准备主体蒙版；本步骤不生成透明图片。请送达模拟响应。');}}
function respond(){const d=doc();if(!d)return;const outcome=document.getElementById('outcome').value,m=d.mask;if(m&&['detecting','generating','unknown-detect','unknown-apply'].includes(m.status)){const detect=m.status==='detecting'||m.status==='unknown-detect';if(outcome==='unknown'){m.status=detect?'unknown-detect':'unknown-apply';notice('结果待确认，保留原请求；送达后续查询响应即可恢复，不重复提交。');}else if(outcome==='failure'){m.status=detect?'detect-error':'apply-error';notice(detect?'识别失败：原图保留，没有可用蒙版。':'生成失败：原图和编辑后的蒙版保留；返回蒙版不会自动重试。');}else if(detect){m.status='ready';if(d.agent)d.agent.status='waiting';notice('蒙版已就绪，尚未产生透明素材。可画笔/橡皮调整，必须点击蒙版栏“抠图”。');}else{const source=findObj(d,m.source),o={id:id('cutout'),kind:'cutout',status:'success',name:(source?.o.name||'源图')+' · 抠图',source:m.source};if(source?.g){let at=source.g.items.indexOf(source.o)+1;while(source.g.items[at]?.source===source.o.id)at++;source.g.items.splice(at,0,o);}else if(source){o.x=source.o.x+172;o.y=source.o.y;d.objects.push(o);}selected=o.id;d.mask=null;if(d.agent)d.agent.status='done';notice('新增透明结果紧邻源图派生链尾部；原图和四个创意方向保留。');}render();return;}
const g=d.groups.find(g=>['running','unknown'].includes(g.status));if(!g){notice('没有等待响应的示例任务。');return;}g.status=outcome;g.items.forEach((o,i)=>o.status=outcome==='success'||outcome==='partial'&&i<2?'success':outcome==='unknown'?'unknown':'failure');notice(outcome==='partial'?'整组结束，仅两张有效结果；保留成功图片与失败槽位。':outcome==='unknown'?'结果未确定，只查询原任务，不自动重提。':outcome==='success'?'本组四张在同一轮状态更新中发布；两处预览引用相同示例结果。':'本轮全部失败，需求保留，可以显式重新生成一组。');render();locateGroup(g.id);}
function drawMask(d){const c=app.querySelector('#mask-canvas');if(!c||!d.mask)return;const m=d.mask,ctx=c.getContext('2d');function draw(){ctx.clearRect(0,0,c.width,c.height);if(['detecting','detect-error','unknown-detect'].includes(m.status))return;ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(74,48,148,198);ctx.strokeStyle='#333';ctx.setLineDash([5,5]);ctx.strokeRect(74,48,148,198);ctx.setLineDash([]);for(const s of m.strokes){ctx.globalCompositeOperation=s.mode==='erase'?'destination-out':'source-over';ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=22;ctx.lineCap='round';ctx.beginPath();s.points.forEach(([x,y],i)=>i?ctx.lineTo(x*296,y*296):ctx.moveTo(x*296,y*296));ctx.stroke();}ctx.globalCompositeOperation='source-over';}draw();let stroke=null;const point=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];};c.onpointerdown=e=>{if(m.status!=='ready')return;e.stopPropagation();c.setPointerCapture(e.pointerId);stroke={mode:brush,points:[point(e)]};m.strokes.push(stroke);m.redo=[];};c.onpointermove=e=>{if(stroke){stroke.points.push(point(e));draw();}};c.onpointerup=e=>{if(stroke){stroke.points.push(point(e));stroke=null;persist();renderTools(d);notice('蒙版笔画已保存为本机演练草稿；没有新增透明图片。');}};}
function locateGroup(gid){const g=doc()?.groups.find(g=>g.id===gid),vp=app.querySelector('#viewport');if(g&&vp){vp.scrollTop=Math.max(0,g.y*zoom-52);vp.scrollLeft=Math.max(0,g.x*zoom-80);renderTools(doc());}}
function locateSelected(){const d=doc(),f=d&&selected&&findObj(d,selected);if(f?.g){locateGroup(f.g.id);const vp=app.querySelector('#viewport');vp.scrollLeft=Math.max(0,(f.g.x+f.g.items.indexOf(f.o)*172)*zoom-120);}else if(d?.groups.length)locateGroup(d.groups[d.groups.length-1].id);renderTools(d);}
document.getElementById('respond').onclick=respond;document.getElementById('save-fail').onclick=()=>{if(doc()){doc().save='error';render();notice('模拟服务端保存失败：本机演练草稿仍保留；任务状态与保存状态分开。');}};
document.getElementById('reopen').onclick=()=>{persist();selected=doc()?.mask?.source||null;render();notice('恢复同一文档、任务与蒙版；没有重建任务，也没有重复插入结果。');};document.getElementById('reset-demo').onclick=()=>{model={page:'home',docs:[],current:null,seq:0};selected=reference=null;dialog=null;mode='image';draft='一只像人一样跳舞的橘猫';render();notice('仅重置本机演练示例，不影响真实项目数据。');};
document.addEventListener('keydown',e=>{if(dialog&&e.key==='Tab'){const items=[...app.querySelectorAll('.sheet button:not(:disabled),.sheet input,.sheet select')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}if(e.key==='Escape'){if(dialog)dialog=null;else if(doc()?.mask){if(doc().mask.status==='ready'){if(doc().save==='error')dialog='mask-exit';else{doc().maskDraft=doc().mask;doc().mask=null;if(doc().agent)doc().agent.status='paused';notice('蒙版草稿已保留，未生成结果。');}}else return;}else selected=null;render();}});if(doc()){selected=doc().mask?.source||null;reference=doc().reference||null;mode=doc().inputMode||'image';draft=doc().inputDraft??draft;}render();
})();
