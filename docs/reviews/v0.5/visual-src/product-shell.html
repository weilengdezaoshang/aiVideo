e-footer details p{margin-top:10px}.app-nav{height:60px;display:flex;align-items:center;gap:25px;padding:0 24px;border-bottom:1px solid var(--line);background:#fff}.app-nav .brand{font-size:21px}.breadcrumbs{display:flex;align-items:center;gap:12px;font-size:12px;color:#6e6e6e}.breadcrumbs button{font-size:12px;padding:7px 2px}.breadcrumbs button:hover{color:#5b5b5b;text-decoration:underline}.app-nav .spacer{flex:1}.prototype-tag{font-size:11px;color:#6e6e6e}.demo-toggle{font-size:11px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#f7f7f7}.app-surface{height:calc(100dvh - 60px);overflow:hidden}.app-surface iframe{height:100%;width:100%;border:0;display:block}.app-warning{display:none}

@media(max-width:760px){.site-nav{padding:0 20px;height:72px}.brand{font-size:23px}.nav-links{gap:16px}.nav-links .how-link{display:none}.nav-links a{font-size:12px}.nav-links .button{padding:9px 12px;font-size:12px;min-height:40px}.intro-main{padding:0 20px}.hero-copy{display:block;padding:30px 0 28px}.hero h1{font-size:46px;line-height:1.3;max-width:none}.hero-description{margin-top:23px;max-width:none;width:100%;justify-self:start}.hero-description p{font-size:14px}.hero-actions{margin-top:21px;gap:21px}.showcase{height:auto;grid-template-columns:1fr 1fr;gap:12px}.art-main{grid-column:1/-1;height:315px}.art-flower,.art-tea{height:180px}.art-caption{bottom:13px;left:13px;right:13px}.art-caption p{display:block}.art-label{top:13px;left:13px}.showcase-bar{align-items:start;flex-direction:column;gap:10px;margin-top:16px}.theme-tabs{gap:3px;flex-wrap:wrap}.theme-tabs button{padding:7px 10px}.asset-note{font-size:10px}.product-story{padding:55px 0 42px}.story-heading{display:block;margin-bottom:22px}.story-heading h2{font-size:29px}.story-heading p{margin-top:15px;font-size:13px}.journey{display:block}.flow-panel{padding:22px;min-height:270px}.flow-heading h3{font-size:19px}.mini-gallery{gap:7px;margin-top:22px}.detail-flow{padding:12px 0 0}.detail-flow article{padding:23px 0;gap:12px}.closing{display:block;padding:28px 24px;margin-bottom:36px}.closing h2{font-size:26px}.closing .button{margin-top:23px}.site-footer{padding:23px 20px;flex-direction:column;gap:13px}.app-nav{height:56px;gap:13px;padding:0 13px}.app-nav .brand{font-size:19px}.breadcrumbs{gap:6px}.breadcrumbs button{font-size:11px}.breadcrumbs #route-label{display:none}.demo-toggle{font-size:10px;padding:5px}.app-surface{height:calc(100dvh - 56px)}.app-warning{display:block;padding:8px 12px;font-size:11px;background:#ececec;color:#5e5e5e}.app-surface:has(.app-warning:not([hidden])) iframe{height:calc(100% - 36px)}}

{{LANDING}}
<section id="product" hidden><header class="app-nav"><a class="brand" href="#intro">aiVideo</a><nav class="breadcrumbs" aria-label="产品导航"><button data-route="intro">产品介绍</button><span aria-hidden="true">/</span><button data-route="workspace">工作台</button><span id="route-label" aria-live="polite"></span></nav><span class="spacer"></span><span class="prototype-tag">交互原型 · 示例数据</span><button class="editor-theme-toggle" id="editor-theme" type="button" aria-label="深色主题" aria-pressed="false" title="切换为深色主题" hidden>{{ICON_MOON}}<span>深色</span></button><button class="demo-toggle" id="demo-toggle" aria-expanded="false">演示控制</button></header><div class="app-surface"><div class="app-warning" id="app-warning" hidden>编辑器适合桌面操作；此处可横向查看完整画布。</div><iframe title="aiVideo 产品交互原型" id="product-frame" srcdoc="{{PRODUCT_PROTOTYPE}}"></iframe></div></section>
<script>
(()=>{'use strict';const VISUAL_ASSETS={{ASSETS_JSON}};const intro=document.getElementById('intro'),product=document.getElementById('product'),frame=document.getElementById('product-frame'),toggle=document.getElementById('demo-toggle');let ready=false,pending=null,current='intro';const themeToggle=document.getElementById('editor-theme');let editorTheme='light';try{editorTheme=localStorage.getItem('aivideo-editor-theme-v1')==='dark'?'dark':'light';}catch{}
function applyTheme(){document.documentElement.dataset.editorTheme=current==='editor'?editorTheme:'light';themeToggle.hidden=current!=='editor';themeToggle.setAttribute('aria-pressed',String(editorTheme==='dark'));themeToggle.title=editorTheme==='dark'?'切换为浅色主题':'切换为深色主题';if(ready)frame.contentWindow.postMessage({type:'product-theme',theme:editorTheme},'*');}
themeToggle.onclick=()=>{editorTheme=editorTheme==='dark'?'light':'dark';try{localStorage.setItem('aivideo-editor-theme-v1',editorTheme);}catch{}applyTheme();};
const introAnchors=['#create-images','#create-canvas','#create-assistant'];
let introAnchor=null;
function reveal(page){
  const name=['intro','workspace','canvas','editor'].includes(page)?page:'intro';
  const previousPage=current;
  if(previousPage!==name)product.getAnimations().forEach(animation=>animation.cancel());
  current=name;applyTheme();intro.hidden=name!=='intro';product.hidden=name==='intro';
  if(previousPage==='intro'&&name!=='intro'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    product.animate([{opacity:.35},{opacity:1}],{duration:200,easing:'cubic-bezier(.22,1,.36,1)'});
  }
  window.dispatchEvent(new CustomEvent('landing-visibility',{detail:name==='intro'}));
  document.getElementById('route-label').textContent=name==='canvas'?'/ 我的画布':name==='editor'?'/ 编辑器':'';
  document.getElementById('app-warning').hidden=name!=='editor';
  const targetHash=name==='intro'&&introAnchor?introAnchor:'#'+name;
  if(location.hash!==targetHash)history.pushState(null,'',targetHash);
  if(name==='intro'){
    const target=introAnchor;introAnchor=null;
    if(target)document.getElementById(target.slice(1))?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
    else window.scrollTo({top:0,behavior:'instant'});
  }
}
function request(page,anchor=null){
  introAnchor=page==='intro'?anchor:null;
  document.getElementById('art-lightbox')?.close();
  if(!ready){pending={page,anchor};return;}
  frame.contentWindow.postMessage({type:'product-navigate',page},'*');
}
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>request(b.dataset.route));
toggle.onclick=()=>frame.contentWindow.postMessage({type:'product-controls'},'*');
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow)return;
  const m=e.data;
  if(m?.type==='product-ready'){
    ready=true;applyTheme();
    if(pending){request(pending.page,pending.anchor);pending=null;}
    else if(['workspace','canvas','editor','example'].includes(location.hash.slice(1)))request(location.hash.slice(1));
  }
  if(m?.type==='product-route')reveal(m.page);
  if(m?.type==='product-control-state'){
    toggle.setAttribute('aria-expanded',String(m.open));
    toggle.textContent=m.open?'收起演示控制':m.pending?'演示控制 · 待响应':'演示控制';
  }
});
window.addEventListener('hashchange',()=>{
  if(introAnchors.includes(location.hash)){
    if(current!=='intro')request('intro',location.hash);
    return;
  }
  const route=location.hash.slice(1)||'intro';
  if(route!==current)request(route);
});
{{LANDING_SCRIPT}}
})();
</script></body></html>
