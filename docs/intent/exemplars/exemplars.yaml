exemplars_version: 0.2.0
embed_model_id: pending
description: P0 intent RAG exemplar library for aiVideo canvas Agent v0.2.0. Adds matting/cutout and compound utterances.
  weak_motion / conflict / multi_step_hint use l2=null + l2_candidates + certainty_expected=weak. Human-reviewed before promote.
l2_enum:
- text_to_image
- image_edit
- text_to_video
- image_to_multiframe
- image_to_video
- other
- unsupported
schema_notes:
  l2_null: Allowed only for weak_motion ambiguous items; use l2_candidates + certainty_expected.
  style_as_art: 'Hard negatives: art/style words must stay image path, never video.'
  one_step_i2v: image_to_video path is feature-gated; default video-from-image is image_to_multiframe.
